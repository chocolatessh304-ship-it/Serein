[storage]
database = "./.runtime/serein.db"
index = "./.runtime/recall-index.sqlite"

[runtime]
writable = false

[embedding]
endpoint = "https://api.openai.com/v1/embeddings"
api_key_env = "OPENAI_API_KEY"

[recall]
direct_threshold = 0.65
max_cards = 2
candidate_limit = 50
passages_enabled = false
passage_min_chars = 500

[extensions.relations]
enabled = false

[extensions.dreams]
enabled = false

[extensions.narrative_scout]
enabled = false

[extensions.event_pipeline]
enabled = false
